<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Planner Financeiro</title>
<meta name="description" content="Controle financeiro pessoal: lançamentos, plantões, cartões, contas e investimentos.">
<meta name="theme-color" content="#0c6b5b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planner">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.syncpill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.syncpill::before{content:"";width:7px;height:7px;border-radius:99px;background:var(--muted)}
.syncpill[data-s="ok"]::before{background:var(--pos)}
.syncpill[data-s="warn"]::before{background:var(--s4)}
.syncpill[data-s="crit"]::before{background:var(--neg)}
@media (max-width:520px){.syncpill{font-size:0;padding:0;width:40px;height:40px;justify-content:center;border-radius:12px}.syncpill::before{width:10px;height:10px}}
/* Layout: mobile-first app shell — header with month switcher, one scrolling view, bottom tab bar + floating add button; on wide screens the tabs become a left rail. */
:root{
  --bg:#f4f6f4; --surface:#ffffff; --surface-2:#eaefec; --fg:#13201b; --muted:#5a6a63; --line:#d9e1dc;
  --accent:#0c6b5b; --accent-soft:#d6ece6; --accent-fg:#ffffff;
  --pos:#08744a; --neg:#b4312f; --warn-bg:#fff3d6; --warn-fg:#7a5200; --crit-bg:#fbe3e2; --crit-fg:#9b2523;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --font-display:-apple-system, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, Roboto, sans-serif;
  --font-body:-apple-system, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, Roboto, sans-serif;
  --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#17201c; --surface-2:#202b27; --fg:#e7eeea; --muted:#9aaaa3; --line:#2b3732;
  --accent:#3fb39c; --accent-soft:#1c3a33; --accent-fg:#06221c;
  --pos:#4cc78b; --neg:#ef7b78; --warn-bg:#3a2f12; --warn-fg:#f5cf73; --crit-bg:#3d1b1a; --crit-fg:#f6a3a1;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#17201c; --surface-2:#202b27; --fg:#e7eeea; --muted:#9aaaa3; --line:#2b3732;
  --accent:#3fb39c; --accent-soft:#1c3a33; --accent-fg:#06221c;
  --pos:#4cc78b; --neg:#ef7b78; --warn-bg:#3a2f12; --warn-fg:#f5cf73; --crit-bg:#3d1b1a; --crit-fg:#f6a3a1;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0}
.app{display:grid;grid-template-columns:1fr;min-height:100%}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-in{display:flex;align-items:center;gap:10px;max-width:1080px;margin:0 auto}
.brand{font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;min-width:0}
.brand .mark{width:26px;height:26px;border-radius:8px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-size:13px;font-weight:700}
.brand span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.monthsw{margin-left:auto;flex:none;display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.monthsw button{border:0;background:none;width:32px;height:32px;border-radius:999px;font-size:18px;color:var(--muted)}
.monthsw button:hover{background:var(--surface-2);color:var(--fg)}
.monthsw .lbl{min-width:96px;text-align:center;font-weight:600;font-size:14px;text-transform:capitalize}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{color:var(--fg)}
.iconbtn svg{width:20px;height:20px}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 140px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));display:flex;justify-content:space-around}
.nav a{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600}
.nav a svg{width:22px;height:22px}
.nav a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:26;width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-fg);box-shadow:0 8px 24px rgba(8,40,32,.28);display:grid;place-items:center}
.fab svg{width:26px;height:26px}
@media (min-width:900px){
  .app{grid-template-columns:200px 1fr}
  .top{grid-column:1/-1}
  .nav{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));align-self:start;flex-direction:column;justify-content:flex-start;gap:4px;border:0;background:none;padding:18px 12px;height:auto}
  .nav a{flex-direction:row;max-width:none;font-size:14px;gap:10px;padding:10px 12px}
  main{padding-bottom:60px}
  .fab{bottom:calc(28px + env(safe-area-inset-bottom,0px));right:calc(28px + env(safe-area-inset-right,0px))}
}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-h h2{font-size:17px;font-weight:600;letter-spacing:-.01em}
.sec-h .aux{color:var(--muted);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:700px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0;display:flex;flex-direction:column;gap:4px}
.kpi .k{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.kpi .v{font-family:var(--font-display);font-size:clamp(17px,4.6vw,22px);font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi.hero{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.kpi.hero .k,.kpi.hero .s{color:var(--accent-fg);opacity:.85}
.pos{color:var(--pos)} .neg{color:var(--neg)} .muted{color:var(--muted)}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:var(--r-sm);font-size:14px;background:var(--warn-bg);color:var(--warn-fg)}
.alert.crit{background:var(--crit-bg);color:var(--crit-fg)}
.alert.info{background:var(--accent-soft);color:var(--fg)}
.alert b{font-weight:700}
.alert .ic{font-weight:800;width:20px;height:20px;border-radius:999px;border:2px solid currentColor;display:grid;place-items:center;font-size:12px;flex:none}
.chartbox{position:relative;height:240px}
.chartbox.sm{height:200px}
.legend{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.legend .li{display:flex;align-items:center;gap:8px;font-size:13.5px;min-width:0}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:none}
.legend .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend .vv{font-variant-numeric:tabular-nums;font-weight:600}
.legend .pc{font-variant-numeric:tabular-nums;color:var(--muted);width:42px;text-align:right}
.keyrow{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:8px}
.keyrow span{display:inline-flex;align-items:center;gap:6px}
.keyrow i{width:10px;height:10px;border-radius:3px;display:inline-block}
.bud{display:flex;flex-direction:column;gap:12px}
.bud .row{display:flex;flex-direction:column;gap:5px}
.bud .top2{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar i.w{background:var(--s4)} .bar i.c{background:var(--neg)}
.list{display:flex;flex-direction:column}
.day{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:14px 2px 6px}
.item{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.item:hover{background:var(--surface-2)}
.av{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;background:var(--surface-2);color:var(--fg)}
.item .mid{flex:1;min-width:0;display:flex;flex-direction:column}
.item .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t2{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .amt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;text-align:right}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--surface-2);color:var(--muted);letter-spacing:.02em}
.pill.pend{background:var(--warn-bg);color:var(--warn-fg)}
.pill.late{background:var(--crit-bg);color:var(--crit-fg)}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:13.5px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px 10px;border-radius:9px;font-weight:600;color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search]{flex:1;min-width:160px}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=month],input[type=password],select,textarea{
  width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:10px 12px;font-size:15px;min-width:0}
textarea{min-height:64px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:600;font-size:14.5px}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.danger{color:var(--neg)}
.btn.danger.armed{background:var(--neg);color:#fff;border-color:var(--neg)}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:10px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.check{display:flex;gap:10px;align-items:center;font-size:14.5px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.bigval{font-family:var(--font-display);font-size:30px;font-weight:600;letter-spacing:-.02em;border:0;border-bottom:2px solid var(--line);border-radius:0;padding:6px 2px;background:none;width:100%}
.bigval:focus{border-bottom-color:var(--accent);outline:none}
/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(5,15,12,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:20px;max-height:88%}}
.sheet .sh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet .sh h3{font-size:18px;font-weight:600}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:-6px auto 0}
/* planilha */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.sheetT{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;width:max-content;min-width:100%}
.sheetT th,.sheetT td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.sheetT th:first-child,.sheetT td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;max-width:170px;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--line)}
.sheetT thead th{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;background:var(--surface-2)}
.sheetT thead th:first-child{background:var(--surface-2)}
.sheetT tr.grp td{background:var(--surface-2);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left}
.sheetT tr.grp td:first-child{background:var(--surface-2)}
.sheetT tr.tot td{font-weight:700}
.sheetT td.cell{cursor:pointer}
.sheetT td.cell:hover{background:var(--accent-soft)}
.sheetT td.cur{background:color-mix(in srgb,var(--accent-soft) 55%,transparent)}
.sheetT td.z{color:var(--muted);opacity:.5}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--muted)}
.empty h3{color:var(--fg);font-size:17px}
.empty p{margin:0;max-width:46ch}
.cardvis{border-radius:16px;padding:16px;color:#fff;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;border:0;text-align:left;width:100%;position:relative;overflow:hidden}
.cardvis .cn{font-family:var(--font-display);font-weight:600;font-size:16px}
.cardvis .cd{font-size:12.5px;opacity:.9}
.cardvis .cv{font-family:var(--font-display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.cardvis[aria-pressed="true"]{outline:3px solid var(--fg);outline-offset:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
.lock{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.lock .box{max-width:320px;width:100%;display:flex;flex-direction:column;gap:14px;text-align:center}
.status{font-size:13px;color:var(--muted);text-align:center}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:10px;border:2px solid transparent}
.swatches button[aria-pressed="true"]{border-color:var(--fg)}
.tabs-inline{display:flex;gap:6px;flex-wrap:wrap}
.minirow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.minirow:last-child{border-bottom:0}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="top-in">
      <div class="brand"><div class="mark">R$</div><span class="t">Planner Financeiro</span></div>
      <div class="monthsw" role="group" aria-label="Mês">
        <button id="mPrev" aria-label="Mês anterior">‹</button>
        <div class="lbl num" id="mLbl">—</div>
        <button id="mNext" aria-label="Próximo mês">›</button>
      </div>
      <button class="syncpill" id="syncPill" data-s="muted" aria-label="Sincronização">Só neste aparelho</button>
      <button class="iconbtn" id="btnSettings" aria-label="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
  </header>
  <nav class="nav" id="nav" aria-label="Seções">
    <a href="#inicio" data-v="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Início</a>
    <a href="#lancamentos" data-v="lancamentos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>Lançamentos</a>
    <a href="#cartoes" data-v="cartoes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19M6 15h4"/></svg>Cartões</a>
    <a href="#investimentos" data-v="investimentos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>Investimentos</a>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="config.js"></script>
<script>
(() => {
'use strict';
// ---------- helpers ----------
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BRL = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const fmt = v => BRL.format(Math.round((v||0)*100)/100);
const fmtK = v => { const a=Math.abs(v); if(a>=1e6) return 'R$ '+(v/1e6).toFixed(1).replace('.',',')+' mi'; if(a>=1e3) return 'R$ '+(v/1e3).toFixed(1).replace('.',',')+' mil'; return 'R$ '+Math.round(v); };
const pct = v => (isFinite(v)? (v*100).toFixed(1).replace('.',',') : '0') + '%';
const r2 = v => Math.round(v*100)/100;
const MON = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MONL = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const pad = n => String(n).padStart(2,'0');
const todayStr = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const mon = d => (d||'').slice(0,7);
const addM = (m,k) => { const y=+m.slice(0,4), mo=+m.slice(5,7); const t=y*12+(mo-1)+k; return `${Math.floor(t/12)}-${pad(t%12+1)}`; };
const mLabel = m => `${MON[+m.slice(5,7)-1]} ${m.slice(0,4)}`;
const mLong = m => `${MONL[+m.slice(5,7)-1]} de ${m.slice(0,4)}`;
const dLabel = d => { const [y,m,dd]=d.split('-'); return `${+dd} ${MON[+m-1]}`; };
const dim = m => new Date(+m.slice(0,4), +m.slice(5,7), 0).getDate();
const parseVal = s => { s=String(s??'').trim().replace(/[R$\s]/g,''); if(!s) return NaN; if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); return Number(s); };
const valIn = v => (v===undefined||v===null||v==='')?'':String(r2(v)).replace('.',',');
const initials = s => (s||'?').replace(/[^\p{L}\p{N} ]/gu,'').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase() || '•';
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const alpha = (hex,a) => { const h=hex.replace('#',''); if(h.length!==6) return hex; return `rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},${a})`; };
const SLOTS = ['--s1','--s2','--s3','--s4','--s5','--s6','--s7','--s8'];
const store = { get(k){ try{return localStorage.getItem(k);}catch(e){return null;} }, set(k,v){ try{localStorage.setItem(k,v);}catch(e){} } };

const PAY = {pix:'Pix', debito:'Débito', credito:'Crédito', boleto:'Boleto', dinheiro:'Dinheiro', transf:'Transferência'};
const CLS = {rf:'Renda fixa', acoes:'Ações', fii:'FIIs', etf:'ETFs', bdr:'BDRs', cripto:'Cripto', fundos:'Fundos', prev:'Previdência', outros:'Outros'};
const CLSGRP = {rf:'Renda fixa', acoes:'Renda variável', fii:'Renda variável', etf:'Renda variável', bdr:'Renda variável', cripto:'Renda variável', fundos:'Fundos e outros', prev:'Fundos e outros', outros:'Fundos e outros'};
const DEF_SET = {
  catsOut:['Moradia','Alimentação','Mercado','Café e lanches','Transporte','Saúde','Educação e cursos','Livros e congressos','Lazer','Viagens','Assinaturas','Vestuário','Impostos e taxas','Presentes','Outros'],
  catsIn:['Bolsa de residência','Plantões','Proventos','Rendimentos','Reembolsos','Outros'],
  budgets:{}, cardMode:'fatura', pin:null, defAcct:null
};
const AK = {cc:'Conta corrente', dig:'Conta digital', pp:'Poupança', din:'Dinheiro em espécie'};

// ---------- state ----------
const S = { tx:[], rec:[], cards:[], inv:{}, assets:[], invtx:[], accts:[], trf:[], set:{...DEF_SET}, month: mon(todayStr()), view:'inicio',
  loaded:{tx:0,rec:0,cards:0,inv:0,assets:0,invtx:0,accts:0,trf:0,set:0}, conn:'loading', ui:{lf:'todos', lq:'', lcat:'', lpay:'', lsub:'mes', card:null, plYear:null} };
const charts = [];

// ---------- domain ----------
const cardById = id => S.cards.find(c=>c.id===id);
function invoiceKey(card, d){
  const day=+d.slice(8,10); const m=mon(d);
  const close = Math.max(1, Math.min(31, +card.close||1)); const due = Math.max(1, Math.min(31, +card.due||10));
  const closeM = day < close ? m : addM(m,1);
  return due > close ? closeM : addM(closeM,1);
}
function catsOut(){ return S.set.catsOut?.length? S.set.catsOut : DEF_SET.catsOut; }
function catsIn(){ return S.set.catsIn?.length? S.set.catsIn : DEF_SET.catsIn; }
const isPlantao = t => t && t.t==='in' && (t.kind==='plantao');

let IDX = null;
function buildIndex(){
  const Y = +S.month.slice(0,4);
  const from = `${Y-1}-01`, to = `${Y+1}-12`;
  const months=[]; for(let m=addM(from,-1); m<=to; m=addM(m,1)) months.push(m);
  const today = todayStr(); const mode = S.set.cardMode||'fatura';
  const E = []; // entries
  for(const t of S.tx){
    if(!t.d || !(t.v>0)) continue;
    const card = t.pay==='credito' ? cardById(t.card) : null;
    if(t.t==='out' && card){
      const n = Math.max(1, Math.min(48, +t.n||1)); const per = r2(t.v/n);
      for(let k=0;k<n;k++){
        const v = k===n-1 ? r2(t.v - per*(n-1)) : per;
        const inv = addM(invoiceKey(card,t.d),k);
        E.push({id:t.id+'#'+k, src:'tx', ref:t, t:'out', v, cat:t.cat, desc: n>1?`${t.desc||t.cat} (${k+1}/${n})`:(t.desc||t.cat), d:t.d, m: mode==='fatura'?inv:addM(mon(t.d),k), inv, card:card.id, pay:'credito', st:'ok'});
      }
    } else {
      const due = t.due || t.d;
      E.push({id:t.id, src:'tx', ref:t, t:t.t, v:t.v, cat:t.cat, desc:t.desc||t.cat, d:t.d, due, m:mon(due), pay:t.pay, acct:t.acct||null, st:t.st||'ok', plantao: isPlantao(t)});
    }
  }
  for(const r of S.rec){
    if(r.on===false || !(r.v>0)) continue;
    for(const m of months){
      if(r.start && m < r.start) continue; if(r.end && m > r.end) continue;
      if(r.freq==='y' && +m.slice(5,7)!==+(r.mon||1)) continue;
      const d = `${m}-${pad(Math.min(dim(m), Math.max(1,+r.day||1)))}`;
      const card = r.pay==='credito' ? cardById(r.card) : null;
      let em = m, inv=null;
      if(r.t==='out' && card){ inv = invoiceKey(card,d); if(mode==='fatura') em = inv; }
      E.push({id:`r:${r.id}:${m}`, src:'rec', ref:r, t:r.t, v:r.v, cat:r.cat, desc:r.name, d, due:d, m:em, inv, card:card?card.id:null, pay:r.pay, acct:(r.t==='out'&&card)?null:(r.acct||null), st: d<=today?'ok':'prev', sub:!!r.sub});
    }
  }
  const aMap = Object.fromEntries(S.assets.map(a=>[a.id,a]));
  const invNet = {};
  for(const x of S.invtx){
    if(!x.d || !(x.v>0)) continue; const a=aMap[x.a];
    if(x.k==='pv') E.push({id:'p:'+x.id, src:'invtx', ref:x, t:'in', v:x.v, cat:'Proventos', desc:`Proventos · ${a? (a.tk||a.name):'ativo'}`, d:x.d, m:mon(x.d), st:'ok', pay:null});
    else { const m=mon(x.d); invNet[m]=(invNet[m]||0)+(x.k==='ap'?x.v:-x.v); }
  }
  const byM = {}; for(const e of E){ (byM[e.m] ||= []).push(e); }
  IDX = {E, byM, invNet, from, to};
}
function monthTotals(m){
  const L = IDX.byM[m]||[]; let inc=0, incOk=0, exp=0, expOk=0;
  for(const e of L){ if(e.t==='in'){ inc+=e.v; if(e.st==='ok') incOk+=e.v; } else { exp+=e.v; if(e.st==='ok') expOk+=e.v; } }
  const inv = IDX.invNet[m]||0;
  return {inc, incOk, exp, expOk, bal:inc-exp, inv};
}
function assetStats(a, upto){
  let ap=0, rs=0, pv=0;
  for(const x of S.invtx){ if(x.a!==a.id) continue; if(upto && mon(x.d)>upto) continue; if(x.k==='ap') ap+=x.v; else if(x.k==='rs') rs+=x.v; else if(x.k==='pv') pv+=x.v; }
  const net = ap-rs;
  let val;
  if(upto){
    const h=(a.hist||[]).filter(h=>h.m<=upto).sort((x,y)=>x.m<y.m?-1:1).pop();
    val = h? h.v : net;
  } else val = (a.val!==undefined && a.val!==null && a.val!=='') ? +a.val : net;
  return {ap, rs, pv, net, val, res: val-net};
}
function invoiceItems(cardId, m){ return IDX.E.filter(e=>e.card===cardId && e.inv===m && e.t==='out'); }
function invoiceTotal(cardId, m){ return invoiceItems(cardId,m).reduce((s,e)=>s+e.v,0); }
const acctById = id => S.accts.find(a=>a.id===id);
const defAcctId = () => (S.set.defAcct && acctById(S.set.defAcct)) ? S.set.defAcct : (S.accts[0] ? S.accts[0].id : '');
function recDate(r,m){ if(r.start && m < r.start) return null; if(r.end && m > r.end) return null; if(r.freq==='y' && +m.slice(5,7)!==+(r.mon||1)) return null; return `${m}-${pad(Math.min(dim(m), Math.max(1,+r.day||1)))}`; }
function acctMoves(a){
  const today=todayStr(), d0=a.d0||today, at0=a.at0||'';
  const ok=(d,at)=> d && d<=today && (d>d0 || (d===d0 && !!at && at>at0));
  const M=[];
  for(const t of S.tx){ if(t.acct!==a.id) continue; if(t.t==='out' && t.pay==='credito') continue; if((t.st||'ok')!=='ok') continue; const d=t.due||t.d; if(!ok(d,t.at)) continue; M.push({d, v:t.t==='in'?t.v:-t.v, desc:t.desc||t.cat, sub:t.cat, kind:'tx', ref:t}); }
  for(const r of S.rec){ if(r.acct!==a.id || r.on===false) continue; if(r.t==='out' && r.pay==='credito') continue;
    for(let m=mon(d0); m<=mon(today); m=addM(m,1)){ const d=recDate(r,m); if(d && ok(d,'')) M.push({d, v:r.t==='in'?r.v:-r.v, desc:r.name, sub:'recorrente', kind:'rec', ref:r}); } }
  for(const [k,x] of Object.entries(S.inv)){ if(x.acct!==a.id || !x.paid || !(x.amt>0)) continue; if(!ok(x.pd,x.at)) continue; const c=cardById(k.slice(0,-8)); M.push({d:x.pd, v:-x.amt, desc:`Fatura ${c?c.name:'do cartão'}`, sub:mLabel(k.slice(-7)), kind:'inv'}); }
  for(const x of S.invtx){ if(x.acct!==a.id) continue; if(!ok(x.d,x.at)) continue; const as=S.assets.find(s=>s.id===x.a); M.push({d:x.d, v: x.k==='ap'? -x.v : x.v, desc:({ap:'Aporte',rs:'Resgate',pv:'Proventos'})[x.k]+' · '+(as?(as.tk||as.name):'investimento'), sub:'investimentos', kind:'invtx', ref:x}); }
  for(const x of S.trf){ if(x.from!==a.id && x.to!==a.id) continue; if(!ok(x.d,x.at)) continue; const out=x.from===a.id; const o=acctById(out?x.to:x.from); M.push({d:x.d, v: out? -x.v : x.v, desc: out?`Transferência para ${o?o.name:'outra conta'}`:`Transferência de ${o?o.name:'outra conta'}`, sub:'transferência', kind:'trf', ref:x}); }
  M.sort((p,q)=>q.d.localeCompare(p.d));
  return M;
}
const acctBal = a => r2((+a.bal0||0) + acctMoves(a).reduce((s,x)=>s+x.v,0));
function acctSelect(id, cur, label='Conta'){ if(!S.accts.length) return ''; return `<label class="f">${label}<select id="${id}"><option value="">Nenhuma conta</option>${S.accts.map(a=>`<option value="${a.id}" ${a.id===cur?'selected':''}>${esc(a.name)}</option>`).join('')}</select></label>`; }

// ---------- armazenamento local + sincronização ----------
const COLLS = ['tx','rec','cards','assets','invtx','accts','trf','inv','settings'];
const L = { items:{}, outbox:{}, meta:{ lastPull:null, uid:null, email:null, lastSync:null } };
let session = null; let syncing=false; S.sync='local';
const CFG = (() => { const c = window.PLANNER_CONFIG||{}; let lc=null; try{ lc=JSON.parse(localStorage.getItem('planner-cfg')||'null'); }catch(e){} const u=(c.supabaseUrl||lc&&lc.url||'').replace(/\/+$/,''); const k=c.supabaseKey||lc&&lc.key||''; return u&&k? {url:u, key:k} : null; })();
const genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,10);
// IndexedDB
let idb=null;
function idbOpen(){ return new Promise((res)=>{ try{ const r=indexedDB.open('planner-financeiro',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>res(null); }catch(e){ res(null); } }); }
function idbGet(k){ return new Promise(res=>{ if(!idb) return res(null); try{ const r=idb.transaction('kv').objectStore('kv').get(k); r.onsuccess=()=>res(r.result??null); r.onerror=()=>res(null); }catch(e){ res(null); } }); }
function idbSet(k,v){ return new Promise(res=>{ if(!idb) return res(false); try{ const t=idb.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=()=>res(true); t.onerror=()=>res(false); }catch(e){ res(false); } }); }
let persistT=0;
function persist(){ clearTimeout(persistT); persistT=setTimeout(async()=>{ await idbSet('items', L.items); await idbSet('outbox', L.outbox); await idbSet('meta', L.meta); }, 250); }
function persistNow(){ clearTimeout(persistT); return Promise.all([idbSet('items', L.items), idbSet('outbox', L.outbox), idbSet('meta', L.meta)]); }
function rebuild(){
  for(const c of ['tx','rec','cards','assets','invtx','accts','trf']) S[c]=[];
  S.inv={}; let set=null;
  for(const it of Object.values(L.items)){
    if(it.del || !it.data) continue;
    if(it.coll==='inv') S.inv[it.id]=it.data;
    else if(it.coll==='settings') set=it.data;
    else if(S[it.coll]) S[it.coll].push({id:it.id, ...it.data});
  }
  S.set = {...DEF_SET, ...(set||{})};
}
function setItem(coll, id, data, del=false){
  const key=coll+'/'+id; const ts=Date.now();
  L.items[key]={coll, id, data: del?null:data, del};
  L.outbox[key]={coll, id, data: del?null:data, del, ts};
  persist(); rebuild(); scheduleRender(); scheduleSync(1500);
}
const col = c => ({
  add: async data => { const id=genId(); setItem(c, id, JSON.parse(JSON.stringify(data))); return {id}; },
  doc: id => ({ set: async data => setItem(c, id, JSON.parse(JSON.stringify(data))), delete: async () => setItem(c, id, null, true) })
});
const settingsRef = { set: async data => setItem('settings','settings', data) };
async function init(){
  idb = await idbOpen();
  if(!idb) toast('Este navegador não permite salvar dados. Abra pelo Safari ou Chrome.');
  L.items = await idbGet('items') || {}; L.outbox = await idbGet('outbox') || {}; L.meta = {...L.meta, ...(await idbGet('meta')||{})};
  try{ session = JSON.parse(localStorage.getItem('planner-session')||'null'); }catch(e){}
  try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
  rebuild(); S.conn='ok'; render(); checkLock();
  if(!CFG) S.sync='local';
  else if(!session){ S.sync='signedout'; let skip=false; try{ skip=localStorage.getItem('planner-skip-login')==='1'; }catch(e){} if(!skip) showAuth(); }
  else { S.sync='idle'; sync(); }
  renderSync();
  window.addEventListener('online', ()=>sync());
  window.addEventListener('offline', ()=>{ S.sync = session? 'offline':S.sync; renderSync(); });
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') sync(); else persistNow(); });
  setInterval(()=>{ if(document.visibilityState==='visible') sync(); }, 60000);
}
let rq=0; function scheduleRender(){ if(rq) return; rq=requestAnimationFrame(()=>{ rq=0; render(); }); }
async function safe(p, okMsg){ try{ await p; if(okMsg) toast(okMsg); return true; } catch(e){ toast('Não foi possível salvar.'); return false; } }
async function saveSettings(patch){ const next = {...S.set, ...patch}; return safe(settingsRef.set(stripSet(next))); }
const stripSet = s => ({catsOut:s.catsOut, catsIn:s.catsIn, budgets:s.budgets||{}, cardMode:s.cardMode||'fatura', pin:s.pin||null, defAcct:s.defAcct||null});
async function put(c, obj, msg){ const {id, ...data} = obj; const clean = JSON.parse(JSON.stringify(data)); if(id) return safe(col(c).doc(id).set(clean), msg); return safe(col(c).add(clean), msg); }
async function del(c, id, msg){ return safe(col(c).doc(id).delete(), msg); }

// --- Supabase (REST) ---
function saveSession(s){ session=s; try{ if(s) localStorage.setItem('planner-session', JSON.stringify(s)); else localStorage.removeItem('planner-session'); }catch(e){} }
async function api(path, opts={}, auth=true){
  const h = {'apikey': CFG.key, 'Content-Type':'application/json', ...(opts.headers||{})};
  if(auth && session) h['Authorization'] = 'Bearer '+session.access_token;
  const r = await fetch(CFG.url+path, {...opts, headers:h});
  const txt = await r.text(); let body=null; try{ body = txt? JSON.parse(txt):null; }catch(e){ body=txt; }
  if(!r.ok){ const err=new Error((body && (body.msg||body.message||body.error_description||body.error)) || ('HTTP '+r.status)); err.status=r.status; err.body=body; throw err; }
  return body;
}
function sessFrom(b){ return {access_token:b.access_token, refresh_token:b.refresh_token, expires_at: b.expires_at || (Math.floor(Date.now()/1000)+(b.expires_in||3600)), uid:b.user&&b.user.id, email:b.user&&b.user.email}; }
async function ensureToken(){
  if(!session) throw new Error('sem sessão');
  if(session.expires_at*1000 - 60000 > Date.now()) return;
  try{ const b = await api('/auth/v1/token?grant_type=refresh_token', {method:'POST', body:JSON.stringify({refresh_token:session.refresh_token})}, false); saveSession({...sessFrom(b), uid:session.uid, email:session.email}); }
  catch(e){ if(e.status===400||e.status===401){ saveSession(null); S.sync='signedout'; renderSync(); toast('Sua sessão expirou. Entre de novo em Ajustes para sincronizar.'); } throw e; }
}
async function adoptUser(s){
  // Primeiro login neste aparelho: dados locais existentes são enviados para a conta.
  if(L.meta.uid && L.meta.uid!==s.uid){ L.items={}; L.outbox={}; L.meta.lastPull=null; rebuild(); render(); }
  if(!L.meta.uid){ const ts=Date.now(); for(const [k,it] of Object.entries(L.items)) L.outbox[k]={...it, ts}; }
  L.meta.uid=s.uid; L.meta.email=s.email; await persistNow();
}
let syncT=0; function scheduleSync(ms){ clearTimeout(syncT); syncT=setTimeout(sync, ms); }
const tsFix = t => String(t).replace(/(\.\d{3})\d+/, '$1');
async function sync(){
  if(!CFG || !session){ renderSync(); return; }
  if(syncing) return; if(!navigator.onLine){ S.sync='offline'; renderSync(); return; }
  syncing=true; S.sync='syncing'; renderSync();
  try{
    await ensureToken();
    // envia pendências
    const pend = Object.entries(L.outbox);
    for(let i=0;i<pend.length;i+=200){
      const chunk = pend.slice(i,i+200);
      const rows = chunk.map(([k,o])=>({user_id:session.uid, coll:o.coll, id:o.id, data:o.data, deleted:!!o.del}));
      await api('/rest/v1/items?on_conflict=user_id,coll,id', {method:'POST', headers:{'Prefer':'resolution=merge-duplicates,return=minimal'}, body:JSON.stringify(rows)});
      for(const [k,o] of chunk){ if(L.outbox[k] && L.outbox[k].ts===o.ts) delete L.outbox[k]; }
    }
    // recebe alterações
    const since = L.meta.lastPull ? new Date(Date.parse(tsFix(L.meta.lastPull)) - 120000).toISOString() : null;
    let offset=0, maxTs=L.meta.lastPull, changed=false;
    for(;;){
      let q = `/rest/v1/items?select=coll,id,data,deleted,updated_at&order=updated_at.asc&limit=1000&offset=${offset}`;
      if(since) q += `&updated_at=gt.${encodeURIComponent(since)}`;
      const rows = await api(q, {method:'GET'});
      for(const r of rows){
        const k=r.coll+'/'+r.id;
        if(!maxTs || Date.parse(tsFix(r.updated_at)) > Date.parse(tsFix(maxTs))) maxTs=r.updated_at;
        if(L.outbox[k]) continue;
        const cur=L.items[k]; const nd=!!r.deleted;
        if(!cur || cur.del!==nd || JSON.stringify(cur.data)!==JSON.stringify(nd?null:r.data)){ L.items[k]={coll:r.coll, id:r.id, data: nd?null:r.data, del:nd}; changed=true; }
      }
      if(rows.length<1000) break; offset+=1000;
    }
    L.meta.lastPull=maxTs; L.meta.lastSync=new Date().toISOString();
    await persistNow();
    if(changed){ rebuild(); scheduleRender(); }
    S.sync = Object.keys(L.outbox).length ? 'pending' : 'ok';
  }catch(e){
    if(S.sync!=='signedout') S.sync = navigator.onLine ? 'error' : 'offline';
    S.syncErr = e && e.message;
  }finally{ syncing=false; renderSync(); if(S.sync==='pending') scheduleSync(5000); }
}

}

async function sha(s){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('caixa:'+s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }

function checkLock(){
  if(!S.set.pin || unlocked){ $('#lockRoot').innerHTML=''; return; }
  $('#lockRoot').innerHTML = `<div class="lock"><form class="box" id="lockF"><div class="brand" style="justify-content:center"><div class="mark">R$</div></div><h2 style="font-size:20px">Digite seu PIN</h2>

  $('#lockPin').focus();
  $('#lockF').onsubmit = async ev => { ev.preventDefault(); if(await sha($('#lockPin').value)===S.set.pin){ unlocked=true; try{sessionStorage.setItem('caixa-unlocked','1');}catch(e){} $('#lockRoot').innerHTML=''; } else { $('#lockMsg').textContent='PIN incorreto.'; $('#lockPin').value=''; } };
}

function recHtml(){

  const row = r => `<button class="item" data-rid="${r.id}"><div class="av" style="${r.t==='in'?'background:var(--accent-soft)':''}">${esc(initials(r.name))}</div><div class="mid"><span class="t1">${esc(r.name)}${r.on===false?' <span class="pill">pausada</span>':''}</span><span class="t2">${esc(r.cat)} · ${r.freq==='y'?`anual, ${+r.day} ${MON[(+r.mon||1)-1]}`:`todo dia ${+r.day}`}${r.pay?' · '+(r.pay==='credito'&&cardById(r.card)?cardById(r.card).name:PAY[r.pay]):''}</span></div><span class="amt ${r.t==='in'?'pos':''}">${fmt(r.v)}${r.freq==='y'?'<span class="muted" style="font-weight:500">/ano</span>':'<span class="muted" style="font-weight:500">/mês</span>'}</span></button>`;

  return `<div class="kpis">
    <div class="kpi"><span class="k">Receitas fixas</span><span class="v num pos">${fmt(incR)}</span><span class="s">por mês</span></div>
    <div class="kpi"><span class="k">Despesas fixas</span><span class="v num">${fmt(fixed)}</span><span class="s">por mês, anuais rateadas</span></div>
    <div class="kpi"><span class="k">Assinaturas</span><span class="v num">${fmt(subM)}</span><span class="s">por mês</span></div>
    <div class="kpi"><span class="k">Assinaturas no ano</span><span class="v num">${fmt(subM*12)}</span><span class="s">${subs.length} serviço${subs.length!==1?'s':''}</span></div></div>
  <div class="panel" style="padding:4px 14px 14px"><div class="list">
    ${grp('Receitas', S.rec.filter(r=>r.t==='in'))}${grp('Assinaturas', S.rec.filter(r=>r.t==='out'&&r.sub))}${grp('Contas e despesas fixas', S.rec.filter(r=>r.t==='out'&&!r.sub))}

  </div><div class="btns" style="margin-top:12px"><button class="btn pri" id="addRec">Nova recorrente</button></div></div>`;
}

        <div class="minirow"><span>Despesas totais</span><b class="num">${fmt(sum(exp))}</b></div>
        <div class="minirow"><span>Saldo do ano</span><b class="num">${fmt(sum(bal))}</b></div>
        <div class="minirow"><span>Investido no ano (líquido)</span><b class="num">${fmt(sum(inv))}</b></div>

      <section class="panel"><div class="sec-h"><h2>Para a declaração</h2><span class="aux">conferir com informes</span></div><div style="margin-top:6px">
        <div class="minirow"><span>Plantões · bruto</span><span class="num">${fmt(plGross)}</span></div>
        <div class="minirow"><span>Plantões · descontos</span><span class="num">${fmt(plGross-plNet)}</span></div>
        <div class="minirow"><span>Plantões · líquido</span><b class="num">${fmt(plNet)}</b></div>
        ${Object.keys(pvBy).length? Object.entries(pvBy).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`<div class="minirow"><span class="muted">Proventos · ${esc(n)}</span><span class="num">${fmt(v)}</span></div>`).join('') : '<div class="minirow"><span class="muted">Nenhum provento lançado</span><span></span></div>'}
        <div class="minirow"><span>Saúde (despesas)</span><span class="num">${fmt(rowSum('out','Saúde'))}</span></div>
        <div class="minirow"><span>Educação e cursos</span><span class="num">${fmt(rowSum('out','Educação e cursos'))}</span></div>

};
function openCell(t,c,m){
  const L=(IDX.byM[m]||[]).filter(e=>e.t===t && e.cat===c).sort((a,b)=>b.d.localeCompare(a.d));
  openSheet(`${c} · ${mLabel(m)}`, `<div class="minirow"><span class="muted">${L.length} lançamento${L.length!==1?'s':''}</span><b class="num">${fmt(L.reduce((s,e)=>s+e.v,0))}</b></div><div class="list">${L.map(itemRow).join('')}</div><div class="btns"><button class="btn pri" id="cellAdd">Lançar em ${esc(c)}</button></div>`, body=>{
    $$('.item[data-eid]',body).forEach(b=>b.onclick=()=>{ const e=IDX.E.find(x=>x.id===b.dataset.eid); closeSheet(); if(e) openEntry(e); });
    $('#cellAdd').onclick=()=>{ const d = m===mon(todayStr())? todayStr() : `${m}-01`; openTxForm(null, {t:t==='in'?(c==='Plantões'?'plantao':'in'):'out', cat:c, d}); };
  });
}

function chipsHtml(name, opts, cur){ return `<div class="chips" data-g="${name}">${opts.map(o=>{ const [v,l]=Array.isArray(o)?o:[o,o]; return `<button type="button" class="chip" data-v="${esc(v)}" aria-pressed="${v===cur}">${esc(l)}</button>`; }).join('')}</div>`; }
function openTxForm(t, preset={}){
  const ex = !!t; t = t || {};
  let kind = ex ? (isPlantao(t)?'plantao':t.t) : (preset.t||'out');
  const d0 = t.d || preset.d || todayStr();
  const html = `
  <div class="seg" id="kSeg">${[['out','Despesa'],['in','Receita'],['plantao','Plantão']].map(([k,n])=>`<button type="button" data-v="${k}" aria-pressed="${k===kind}">${n}</button>`).join('')}</div>
  <div id="fBody"></div>
  <div class="btns" style="justify-content:space-between"><div class="btns">${ex?`<button class="btn danger" id="fDel" data-l="Excluir">Excluir</button>`:''}</div><div class="btns"><button class="btn" id="fCancel">Cancelar</button><button class="btn pri" id="fSave">Salvar</button></div></div>`;
  openSheet(ex?'Editar lançamento':'Novo lançamento', html, body=>{
    const st = { cat: t.cat || preset.cat || '', pay: t.pay || 'pix', card: t.card || (S.cards[0]&&S.cards[0].id) || '', status: t.st || 'ok', acct: ex ? (t.acct||'') : defAcctId() };
    const draw = () => {
      const fb=$('#fBody');
      if(kind==='plantao'){
        fb.innerHTML = `<div style="display:flex;flex-direction:column;gap:14px">
          <div class="frow"><label class="f">Valor bruto<input class="bigval num" id="fGross" inputmode="decimal" placeholder="0,00" value="${valIn(t.gross ?? (ex?t.v:''))}"></label>
          <label class="f">Descontos (INSS, ISS, IR, taxas)<input type="text" id="fDisc" inputmode="decimal" placeholder="0,00" value="${valIn(t.disc)}"></label></div>
          <div class="minirow"><span class="muted">Líquido</span><b class="num" id="fNet">${fmt(0)}</b></div>
          <label class="f">Local / hospital<input type="text" id="fDesc" placeholder="Ex.: PS HC Unicamp, 12h noturno" value="${esc(t.place||t.desc||'')}"></label>
          <div class="frow"><label class="f">Data do plantão<input type="date" id="fDate" value="${d0}"></label><label class="f">Previsão de pagamento<input type="date" id="fDue" value="${t.due||''}"></label></div>
          ${chipsHtml('status', [['pend','A receber'],['ok','Recebido']], ex? st.status : 'pend')}
          ${acctSelect('fAcct', st.acct, 'Conta que recebe')}
          <label class="f">Observações<textarea id="fNotes">${esc(t.notes||'')}</textarea></label></div>`;
        const upd=()=>{ const g=parseVal($('#fGross').value)||0, dd=parseVal($('#fDisc').value)||0; $('#fNet').textContent=fmt(g-dd); };
        $('#fGross').oninput=upd; $('#fDisc').oninput=upd; upd();
        bindPressGroup(fb,'[data-g="status"] .chip');
      } else {
        const cats = kind==='in'? catsIn() : catsOut();
        if(!cats.includes(st.cat)) st.cat = kind==='in'? (cats[0]) : '';
        fb.innerHTML = `<div style="display:flex;flex-direction:column;gap:14px">
          <label class="f">Valor${kind==='out'?' total':''}<input class="bigval num" id="fVal" inputmode="decimal" placeholder="0,00" value="${valIn(t.v)}"></label>
          <label class="f">Descrição<input type="text" id="fDesc" placeholder="${kind==='in'?'Ex.: Bolsa de novembro':'Ex.: Café no hospital'}" value="${esc(t.desc||'')}"></label>
          <div class="f" style="display:flex;flex-direction:column;gap:6px"><span class="muted" style="font-size:13px;font-weight:600">Categoria</span>${chipsHtml('cat', cats, st.cat)}</div>
          <label class="f">Data${kind==='out'?' da compra':''}<input type="date" id="fDate" value="${d0}"></label>
          ${kind==='out'? `<div class="f" style="display:flex;flex-direction:column;gap:6px"><span class="muted" style="font-size:13px;font-weight:600">Forma de pagamento</span>${chipsHtml('pay', Object.entries(PAY), st.pay)}</div><div id="fPayX"></div>` :
            `${chipsHtml('status', [['ok','Recebido'],['pend','A receber']], st.status)}<label class="f" id="fDueW">Data prevista<input type="date" id="fDue" value="${t.due||''}"></label>${acctSelect('fAcct', st.acct, 'Conta que recebe')}`}
          ${!ex? `<label class="check"><input type="checkbox" id="fRep"> Repetir todo mês (vira recorrente)</label>`:''}
          <label class="f">Observações<textarea id="fNotes">${esc(t.notes||'')}</textarea></label></div>`;
        bindPressGroup(fb,'[data-g="cat"] .chip', v=>st.cat=v);
        if(kind==='out'){
          const payX=()=>{ const x=$('#fPayX');
            if(st.pay==='credito'){ x.innerHTML = S.cards.length? `<div class="frow"><label class="f">Cartão<select id="fCard">${S.cards.map(c=>`<option value="${c.id}" ${c.id===st.card?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label class="f">Parcelas<input type="number" id="fN" min="1" max="48" value="${t.n||1}"></label></div><div class="status" id="fInvHint" style="text-align:left"></div>` : `<div class="alert"><span class="ic">!</span><span>Cadastre um cartão em Cartões para lançar compras no crédito.</span></div>`;
              const hint=()=>{ const c=cardById($('#fCard')?.value); const d=$('#fDate').value; if(c&&d) $('#fInvHint').textContent=`Cai na fatura que vence em ${mLong(invoiceKey(c,d))}.`; };
              if($('#fCard')){ $('#fCard').onchange=e=>{st.card=e.target.value;hint();}; $('#fDate').addEventListener('change',hint); hint(); }
            } else {
              x.innerHTML = `<div style="display:flex;flex-direction:column;gap:12px">${chipsHtml('status', [['ok','Pago'],['pend','A pagar']], st.status)}<label class="f" id="fDueW">Vencimento<input type="date" id="fDue" value="${t.due||''}"></label>${acctSelect('fAcct', st.acct, 'Conta de onde sai')}</div>`;

            } };
          bindPressGroup(fb,'[data-g="pay"] .chip', v=>{ st.pay=v; payX(); }); payX();
        } else {
          bindPressGroup(fb,'[data-g="status"] .chip', v=>{ st.status=v; $('#fDueW').hidden = v!=='pend'; }); $('#fDueW').hidden = st.status!=='pend';
        }
      }
      setTimeout(()=>{ const i=$('#fVal')||$('#fGross'); if(i && !ex) i.focus(); }, 50);
    };
    bindPressGroup(body,'#kSeg button', v=>{ kind=v; draw(); });
    draw();
    $('#fCancel').onclick=closeSheet;
    if(ex) armDelete($('#fDel'), async()=>{ closeSheet(); await del('tx', t.id, 'Lançamento excluído'); });
    $('#fSave').onclick=async()=>{
      const d=$('#fDate').value; if(!d){ toast('Informe a data.'); return; }
      const notes=$('#fNotes').value.trim();
      let obj;
      if(kind==='plantao'){
        const g=parseVal($('#fGross').value), dd=parseVal($('#fDisc').value)||0;
        if(!(g>0)){ toast('Informe o valor bruto do plantão.'); return; }
        const place=$('#fDesc').value.trim();
        obj={ t:'in', kind:'plantao', cat:'Plantões', gross:r2(g), disc:r2(dd), v:r2(g-dd), place, desc: place?`Plantão · ${place}`:'Plantão', d, due:$('#fDue').value||null, st: pressed(body,'[data-g="status"] .chip')||'pend' };
        if(!(obj.v>0)){ toast('Os descontos não podem ser maiores que o bruto.'); return; }
      } else {
        const v=parseVal($('#fVal').value); if(!(v>0)){ toast('Informe um valor maior que zero.'); return; }
        if(!st.cat){ toast('Escolha uma categoria.'); return; }
        obj={ t:kind, cat:st.cat, v:r2(v), desc:$('#fDesc').value.trim(), d };
        if(kind==='out'){ obj.pay=st.pay;
          if(st.pay==='credito'){ if(!S.cards.length){ toast('Cadastre um cartão primeiro.'); return; } obj.card=$('#fCard').value; obj.n=Math.max(1,Math.min(48,+$('#fN').value||1)); obj.st='ok'; }
          else { obj.st=pressed(body,'[data-g="status"] .chip')||'ok'; obj.due = obj.st==='pend'? ($('#fDue').value||null) : null; }
        } else { obj.st=pressed(body,'[data-g="status"] .chip')||'ok'; obj.due = obj.st==='pend'? ($('#fDue').value||null) : null; }
        if($('#fRep') && $('#fRep').checked){
          if(obj.pay==='credito' && obj.n>1){ toast('Uma compra parcelada não pode ser recorrente.'); return; }
          closeSheet();
          await put('rec', { t:obj.t, name: obj.desc||obj.cat, v:obj.v, cat:obj.cat, freq:'m', day:+d.slice(8,10), start:mon(d), pay:obj.pay||null, card:obj.card||null, acct: obj.pay==='credito'?null:(($('#fAcct')&&$('#fAcct').value)||null), sub: obj.cat==='Assinaturas', on:true, at:new Date().toISOString() }, 'Recorrente criada');
          return;
        }
      }
      if(notes) obj.notes=notes;
      obj.acct = (obj.pay==='credito') ? null : (($('#fAcct') && $('#fAcct').value) || null);
      obj.at = t.at || new Date().toISOString(); if(t.ex) obj.ex=true;
      if(ex) obj.id=t.id;
      closeSheet();
      await put('tx', obj, ex?'Lançamento atualizado':'Lançamento salvo');
    };
  });
}

async function wipe(pred){
  const jobs=[]; for(const c of ['tx','rec','cards','assets','invtx','accts','trf']) for(const x of S[c]) if(pred(x)) jobs.push([c,x.id]);
  if(pred({})) for(const k of Object.keys(S.inv)) jobs.push(['inv',k]);
  toast(`Removendo ${jobs.length} itens…`);
  for(const [c,id] of jobs){ try{ await col(c).doc(id).delete(); }catch(e){} }
}
async function save(filename, data){
  const type = filename.endsWith('.json')? 'application/json' : 'text/csv';
  const blob = new Blob([data], {type});
  try{ const f=new File([blob], filename, {type}); if(navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f], title:filename}); return; } }catch(e){ if(e && e.name==='AbortError') return; }
  const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u), 4000);
}
function exportJson(){ const o={app:'caixa-do-residente', version:1, exportedAt:new Date().toISOString(), tx:S.tx, rec:S.rec, cards:S.cards, inv:S.inv, assets:S.assets, invtx:S.invtx, accts:S.accts, trf:S.trf, settings:stripSet(S.set)}; save(`planner-financeiro-backup-${todayStr()}.json`, JSON.stringify(o,null,1)); }
function exportCsv(Y){
  const rows=[['Data','Mês de referência','Tipo','Categoria','Descrição','Valor','Forma','Cartão','Status']];
  const L=IDX.E.filter(e=>e.m.slice(0,4)===Y).sort((a,b)=>a.m.localeCompare(b.m)||a.d.localeCompare(b.d));
  for(const e of L) rows.push([e.d.split('-').reverse().join('/'), e.m, e.t==='in'?'Receita':'Despesa', e.cat, e.desc, (e.t==='in'?1:-1)*e.v, e.pay?PAY[e.pay]:'', e.card&&cardById(e.card)?cardById(e.card).name:'', {ok:'ok',pend:'pendente',prev:'previsto'}[e.st]||'']);
  const csv='﻿'+rows.map(r=>r.map(v=>typeof v==='number'? String(r2(v)).replace('.',',') : `"${String(v??'').replace(/"/g,'""')}"`).join(';')).join('\r\n');
  save(`planner-financeiro-${Y}.csv`, csv);
}
async function importJson(file){
  if(!file) return; const msg=$('#sImpMsg');
  try{ const o=JSON.parse(await file.text()); if(o.app!=='caixa-do-residente') throw 0;
    let n=0; msg.textContent='Restaurando…';
    for(const c of ['accts','cards','assets','rec','tx','invtx','trf']) for(const x of (o[c]||[])){ const {id,...d}=x; if(!id) continue; await col(c).doc(id).set(d); n++; }
    for(const [k,v] of Object.entries(o.inv||{})){ await col('inv').doc(k).set(v); n++; }
    if(o.settings) await settingsRef.set(stripSet({...DEF_SET, ...o.settings}));
    msg.textContent=`${n} itens restaurados.`; toast('Backup restaurado');
  }catch(e){ msg.textContent='Arquivo inválido. Escolha um backup baixado por este app.'; }
}
